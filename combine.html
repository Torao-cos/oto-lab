<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>正弦波の合成 - おとラボ</title>
<link rel="stylesheet" href="../nami-lab/common.css">
<style>
  /* combine.html ローカル補正（common.css は編集しない） */
  .panel.cmb{min-height:280px}
  .controls .readout.big{font-size:1.12rem}
  .num{display:inline-block;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .controls .wv0{color:var(--c0);font-weight:900}
  .controls .wv1{color:var(--c1);font-weight:900}
  .controls .wv2{color:var(--c2);font-weight:900}
  .controls .wvy{color:var(--cy);font-weight:900}
  .controls .wave-row{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem .9rem;flex-basis:100%;padding:.25rem 0 .25rem .55rem;border-left:4px solid var(--cw)}
  .controls .wave-row.off .ctl:not(.onoff){opacity:.45}
  .controls .wave-row .onoff label{font-weight:900;color:var(--cw);white-space:nowrap}
  .controls .wave-row input[type=number]{width:5.2rem;padding:.3rem .35rem}
  .controls .wave-row .val{display:none}
  .controls .wave-row .unit{color:var(--text);font-weight:700;min-width:1.6rem}
  html[data-mode=proj] .panel.cmb{min-height:320px}
  @media (max-width:760px){
    .panel.cmb{min-height:270px}
    .controls .readout.big{font-size:1rem}
    .controls .wave-row input[type=range]{width:110px}
  }
</style>
</head><body>
<script src="../nami-lab/common.js"></script>
<script>
(() => {
'use strict';
const { C, TAU, ui, fmt, clamp, PROJ, SC, mathHTML } = Nami;
const S = v => v * SC;
const mfmt = (v, d = 2) => fmt(v, d).replace('-', '−');           // 表示用のマイナス記号
const N = (v, d = 2, w = 5) => `<span class="num" style="min-width:${w}ch">${mfmt(v, d)}</span>`; // 固定幅の数値（読み出し欄が値の長さで伸び縮みして改行・ちらつきしないように）
const mod = (a, b) => a - Math.floor(a / b) * b;
const COL = [C.wave1, C.wave2, Nami.PROJ ? '#8e24aa' : C.dens];                     // y₁ 青・y₂ 赤・y₃ 紫（投影で赤と紛れない色）
const SUB = ['₁', '₂', '₃'];
const IDX = [0, 1, 2];
document.documentElement.style.setProperty('--c0', COL[0]);
document.documentElement.style.setProperty('--c1', COL[1]);
document.documentElement.style.setProperty('--c2', COL[2]);
document.documentElement.style.setProperty('--cy', C.wave);

/* ===================== 状態 ===================== */
// 位置 x モード: y_i(x,t) = A_i sin 2π(x − Δx_i − vt)/λ_i
// 時刻 t モード: y_i(t)   = A_i sin 2π f_i (t − Δt_i)
const St = {
  axis: 't',
  on: [true, true, false],
  A: [0.5, 0.25, 0.25],
  lam: [4, 2, 4 / 3], f: [1, 2, 3],
  sx: [0, 0, 0], st: [0, 0, 0],
  Wx: 8, Wt: 3, v: 1.0,
  xg: 2.6,
  ghost: false
};
const A_MAX = 1.0;
const LIM = { f: [0.2, 10, 0.05], lam: [0.25, 8, 0.05], A: [0, A_MAX, 0.01] };

/* プリセット: 倍率 r と振幅（値を入れるだけ） */
const PRESETS = [
  ['free', '自由'],
  ['p1', '基本音のみ', [1, 0, 0], [1, 2, 3], [0.6, 0.25, 0.25]],
  ['p12', '基本音＋2倍音', [1, 1, 0], [1, 2, 3], [0.5, 0.25, 0.25]],
  ['p13', '基本音＋3倍音', [1, 0, 1], [1, 2, 3], [0.5, 0.25, 0.25]],
  ['p123', '基本音＋2倍音＋3倍音', [1, 1, 1], [1, 2, 3], [0.5, 0.25, 0.25]],
  ['odd', '1, 3, 5 倍（振幅 1, 1/3, 1/5）', [1, 1, 1], [1, 3, 5], [0.6, 0.2, 0.12]],
  ['harm', '1, 2, 3 倍（振幅 1, 1/2, 1/3）', [1, 1, 1], [1, 2, 3], [0.54, 0.27, 0.18]]
];
const F1 = 1, L1 = 4;   // プリセットの基本音: f₁ = 1 Hz（t）／λ₁ = 4 m（x）

function buildCombine(ctx) {
  ctx.layout('1');
  const sim = ctx.sim;
  const cvU = ctx.canvas({ title: '　', className: 'cmb' });
  const cvL = ctx.canvas({ title: '　', className: 'cmb' });

  /* ---------- 物理 ---------- */
  const isX = () => St.axis === 'x';
  const W = () => (isX() ? St.Wx : St.Wt);
  const per = i => (isX() ? St.lam[i] : 1 / St.f[i]);                 // 横軸方向の1周期（λ または T）
  const shiftArr = () => (isX() ? St.sx : St.st);
  const off = t => (isX() ? St.v * t : 0);                              // 進行による移動
  const ons = () => IDX.filter(i => St.on[i]);
  const yi = (i, u, t) => St.A[i] * Math.sin(TAU * (u - shiftArr()[i] - off(t)) / per(i));
  const ysum = (u, t) => ons().reduce((s, i) => s + yi(i, u, t), 0);
  const cursor = () => (isX() ? St.xg : sim.t);
  const sumName = () => { const o = ons(); return o.length ? 'y = ' + o.map(i => 'y' + SUB[i]).join(' + ') : 'y = 0'; };
  // 合成波の周期（x なら波長）: 入っている波がどれも整数回分になる最短の長さ
  function sumPeriod() {
    const o = ons(); if (!o.length) return null;
    const P = o.map(per), pm = Math.max(...P);
    for (let k = 1; k <= 400; k++) {
      const T = k * pm;
      if (P.every(p => { const r = T / p; return Math.abs(r - Math.round(r)) < 2e-3 * Math.max(1, r); })) return T;
    }
    return null;
  }
  let curT = 0;                                                          // 直近の描画時刻

  /* ---------- 縦軸の範囲（振幅ドラッグ中は固定＝ポインタとずれない） ---------- */
  let Ymax = 1.2, freezeY = false;
  const updY = () => { if (!freezeY) Ymax = Math.max(0.6, ons().reduce((s, i) => s + St.A[i], 0)) * 1.18; };

  /* ---------- 操作パネル ---------- */
  const ro = ui.readout(ctx.controls, { label: '縦線の位置で', value: '' }); ro.box.querySelector('.readout').classList.add('big');
  const roPos = ui.readout(ctx.controls, { label: '縦線', value: '' });
  const roPer = ui.readout(ctx.controls, { label: '合成波の周期', value: '' }); const roPerLab = roPer.box.querySelector('.ctlLabel');
  ui.legend(ctx.controls, [[COL[0], 'y₁'], [COL[1], 'y₂'], [COL[2], 'y₃'], [C.wave, '合成波 y'], [C.guide, '縦線']]);
  ui.sep(ctx.controls);
  const selAxis = ui.select(ctx.controls, {
    label: '横軸', value: St.axis, options: [['t', '時刻 t [s]（y-t グラフ）'], ['x', '位置 x [m]（y-x グラフ）']],
    onChange: v => setAxis(v)
  });
  const selPre = ui.select(ctx.controls, {
    label: 'プリセット', value: 'p12', options: PRESETS.map(p => [p[0], p[1]]),
    onChange: v => applyPreset(v)
  });
  const toFree = () => selPre.set('free', true);

  // スライダー＋数値入力（どちらを動かしても同期）。値の正は St[key][i]（スライダーの刻みに丸めない）
  function numSlider(parent, key, i, label, unit) {
    const [mn, mx, stp] = LIM[key];
    const s = ui.slider(parent, { label, min: mn, max: mx, step: stp, value: St[key][i], onInput: v => { St[key][i] = v; nb.value = fmtIn(v); toFree(); } });
    const nb = document.createElement('input'); nb.type = 'number'; nb.min = mn; nb.max = mx; nb.step = 0.01; nb.value = fmtIn(St[key][i]);
    nb.setAttribute('aria-label', label.replace(/<[^>]+>/g, ''));
    const un = document.createElement('span'); un.className = 'unit'; un.textContent = unit;
    s.box.appendChild(nb); s.box.appendChild(un);
    nb.addEventListener('input', () => {
      const v = parseFloat(nb.value); if (!isFinite(v)) return;
      const c = clamp(v, mn, mx); if (key !== 'A' && c <= 0) return;
      St[key][i] = c; s.set(c, true); toFree();
    });
    nb.addEventListener('change', () => { nb.value = fmtIn(St[key][i]); });
    return { s, nb, box: s.box, set: v => { St[key][i] = v; s.set(v, true); nb.value = fmtIn(v); } };
  }
  function fmtIn(v) { return String(Math.round(v * 100) / 100); }

  const rows = [], tOn = [], cF = [], cL = [], cA = [];
  for (const i of IDX) {
    const row = document.createElement('div'); row.className = 'wave-row'; row.style.setProperty('--cw', COL[i]);
    ctx.controls.appendChild(row); rows.push(row);
    tOn[i] = ui.toggle(row, { label: `y${SUB[i]} を入れる`, checked: St.on[i], onChange: b => { St.on[i] = b; syncOn(); toFree(); } });
    tOn[i].box.classList.add('onoff');
    cF[i] = numSlider(row, 'f', i, `f${SUB[i]}`, 'Hz');
    cL[i] = numSlider(row, 'lam', i, `λ${SUB[i]}`, 'm');
    cA[i] = numSlider(row, 'A', i, `A${SUB[i]}`, 'm');
  }
  ui.sep(ctx.controls);
  const sWx = ui.slider(ctx.controls, { label: '横軸の幅', min: 1, max: 30, step: 0.5, value: St.Wx, unit: 'm', digits: 1, onInput: v => { St.Wx = v; St.xg = clamp(St.xg, 0, v); } });
  const sWt = ui.slider(ctx.controls, { label: '横軸の幅', min: 1, max: 20, step: 0.5, value: St.Wt, unit: 's', digits: 1, onInput: v => { St.Wt = v; } });
  const tGhost = ui.toggle(ctx.controls, { label: '下段に成分波も薄く重ねる', checked: St.ghost, onChange: b => { St.ghost = b; } });
  const roShift = ui.readout(ctx.controls, { label: 'ずれ', value: '' });

  /* 「詳しく」 */
  ui.slider(ctx.detail, { label: '波の速さ v（位置 x のとき）', min: 0, max: 3, step: 0.05, value: St.v, unit: 'm/s', onInput: v => { St.v = v; } });

  function syncOn() { IDX.forEach(i => rows[i].classList.toggle('off', !St.on[i])); cvL.setTitle(mathHTML('下段：合成波 ' + sumName())); }
  function syncAxisUI() {
    const x = isX();
    roPerLab.innerHTML = mathHTML(x ? '合成波の波長' : '合成波の周期');
    cF.forEach(c => { c.box.hidden = x; }); cL.forEach(c => { c.box.hidden = !x; });
    sWx.box.hidden = !x; sWt.box.hidden = x;
    cvU.setTitle(mathHTML('上段：成分波'));
    syncOn();
  }
  function setAxis(v) { St.axis = v; sim.reset(); syncAxisUI(); }
  function applyPreset(p) {
    const P = PRESETS.find(q => q[0] === p); if (!P || !P[2]) return;
    const [, , on, r, A] = P;
    IDX.forEach(i => {
      St.on[i] = !!on[i]; tOn[i].set(St.on[i], true);
      cA[i].set(A[i]); cF[i].set(F1 * r[i]); cL[i].set(L1 / r[i]);
    });
    St.sx = [0, 0, 0]; St.st = [0, 0, 0];
    St.Wx = 8; St.Wt = 3; sWx.set(St.Wx, true); sWt.set(St.Wt, true); St.xg = clamp(St.xg, 0, St.Wx);
    sim.reset(); freezeY = false; syncOn(); updY();
  }

  /* ---------- 山の取っ手（上段） ---------- */
  const peakK = [0, 0, 0];
  const anchor = i => W() * [0.22, 0.5, 0.78][i];
  const peakU = (i, k) => shiftArr()[i] + off(curT) + per(i) * (k + 0.25);
  const chooseK = i => { const p = per(i); peakK[i] = Math.round((anchor(i) - shiftArr()[i] - off(curT)) / p - 0.25); };
  let active = null;   // {kind:'h'|'curve'|'line', i}
  let hover = null;
  const handles = IDX.map(i => cvU.addHandle({
    r: S(18) + 4, hidden: false, i,
    get: () => ({ x: peakU(i, peakK[i]), y: St.A[i] }),
    set: (x, y) => {
      cA[i].set(clamp(Math.round(y * 100) / 100, 0, A_MAX));
      x = clamp(x, 0, W());
      shiftArr()[i] = x - off(curT) - per(i) * (peakK[i] + 0.25);
      toFree();
    },
    onStart: () => { active = { kind: 'h', i }; freezeY = true; },
    onEnd: () => { active = null; freezeY = false; }
  }));

  /* ---------- 縦線・曲線のドラッグ（取っ手 > 縦線 > 曲線） ---------- */
  const LINE_TOL = () => S(12) + 4, CURVE_TOL = () => S(14);
  function hitTarget(cv, p, allowCurve) {
    if (Math.abs(cv.px(cursor()) - p.x) <= LINE_TOL()) return { kind: 'line' };
    if (!allowCurve) return null;
    const u = cv.wx(p.x); let best = null, bd = CURVE_TOL();
    for (const i of ons()) { const d = Math.abs(cv.py(yi(i, u, curT)) - p.y); if (d <= bd) { bd = d; best = { kind: 'curve', i }; } }
    return best;
  }
  let drag = null, wasRunning = false;
  function setLine(u) {
    if (isX()) St.xg = clamp(u, 0, St.Wx);
    else sim.setT(clamp(u, 0, St.Wt - 1e-6));
  }
  function bindDrag(cv, allowCurve) {
    cv.onDragStart = (wx, wy, p) => {
      const h = hitTarget(cv, p, allowCurve);
      if (!h) { drag = null; return; }
      drag = Object.assign({ u0: wx }, h);
      if (h.kind === 'curve') drag.s0 = shiftArr()[h.i];
      if (h.kind === 'line' && !isX()) { wasRunning = sim.running; sim.pause(); }
      active = h;
    };
    cv.onDrag = (wx) => {
      if (!drag) return;
      if (drag.kind === 'line') setLine(wx);
      else { shiftArr()[drag.i] = drag.s0 + (wx - drag.u0); toFree(); }
    };
    cv.onDragEnd = () => {
      if (drag && drag.kind === 'line' && !isX() && wasRunning) sim.play();
      drag = null; active = null;
    };
    cv.el.addEventListener('pointermove', ev => {   // ホバー表示とカーソル（common の後に登録＝上書き）
      if (cv._down) { if (drag || cv._down.h) cv.el.style.cursor = drag && drag.kind === 'line' ? 'ew-resize' : 'grabbing'; return; }
      const r = cv.el.getBoundingClientRect(); const p = { x: ev.clientX - r.left, y: ev.clientY - r.top };
      const hh = cv._hit(p);
      hover = hh ? { kind: 'h', i: hh.i } : hitTarget(cv, p, allowCurve);
      cv.el.style.cursor = !hover ? 'pointer' : hover.kind === 'line' ? 'ew-resize' : 'grab';
    });
    cv.el.addEventListener('pointerleave', () => { if (!cv._down) hover = null; });
  }
  bindDrag(cvU, true); bindDrag(cvL, false);

  /* ---------- 描画 ---------- */
  const hl = i => (active && active.i === i && active.kind !== 'line') || (!active && hover && hover.i === i && hover.kind !== 'line');
  const lineHl = () => (active && active.kind === 'line') || (!active && hover && hover.kind === 'line');
  const ring = PROJ ? '#ffffff' : '#000000';
  function setupPanel(cv) {
    cv.clear(); cv.setView({ x0: 0, x1: W(), y0: -Ymax, y1: Ymax });
    cv.axes({ xLabel: isX() ? 'x [m]' : 't [s]', yLabel: 'y [m]' });
  }
  function drawLine(cv) {
    const u = cursor(), X = cv.px(u), on = lineHl();
    cv.linePx(X, cv.pad.t, X, cv.pad.t + cv.ih, { color: C.guide, width: on ? 3 : 2, dash: [7, 5] });
    // 取っ手（上端のつまみ）
    const g = cv.ctx, w = S(16), h = S(14), y0 = cv.pad.t;
    g.save(); g.fillStyle = on ? C.yellow : C.guide; g.beginPath();
    g.moveTo(X - w / 2, y0); g.lineTo(X + w / 2, y0); g.lineTo(X + w / 2, y0 + h * 0.6); g.lineTo(X, y0 + h); g.lineTo(X - w / 2, y0 + h * 0.6); g.closePath(); g.fill();
    g.strokeStyle = C.bg; g.lineWidth = 1.2 * SC; g.beginPath(); g.moveTo(X - w * 0.18, y0 + h * 0.18); g.lineTo(X - w * 0.18, y0 + h * 0.55); g.moveTo(X + w * 0.18, y0 + h * 0.18); g.lineTo(X + w * 0.18, y0 + h * 0.55); g.stroke();
    g.restore();
  }
  // 値ラベル群: 左右の置き場所を決め（はみ出すなら反対側へ）、同じ側で近いものは上下に離して描く
  function labels(cv, list) {
    const g = cv.ctx; g.save(); g.font = 'bold ' + (14 * SC) + 'px system-ui,sans-serif';
    list.forEach(L => {
      const w = g.measureText(L.str).width * 1.08 + S(12);
      L.al = L.side;
      if (L.side === 'right' && L.X + S(10) + w > cv.w - 2) L.al = 'left';
      if (L.side === 'left' && L.X - S(10) - w < 2) L.al = 'right';
    });
    g.restore();
    const gap = S(19), lo = cv.pad.t + S(10), hi = cv.pad.t + cv.ih - S(10);
    for (const side of ['left', 'right']) {
      const grp = list.filter(L => L.al === side).sort((a, b) => a.Y - b.Y);
      grp.forEach(L => { L.Y = clamp(L.Y, lo, hi); });
      for (let k = 1; k < grp.length; k++) if (grp[k].Y - grp[k - 1].Y < gap) grp[k].Y = grp[k - 1].Y + gap;
      const over = grp.length ? grp[grp.length - 1].Y - hi : 0;      // 下にはみ出したら全体を上へ
      if (over > 0) grp.forEach(L => { L.Y -= over; });
    }
    list.forEach(L => cv.textPx(L.str, L.X + (L.al === 'right' ? S(10) : -S(10)), L.Y, { align: L.al === 'right' ? 'left' : 'right', color: L.color, bold: true, size: 14 }));
  }
  function drawUpper(t) {
    const cv = cvU, o = ons(); setupPanel(cv);
    cv.clip(() => {
      for (const i of IDX) if (!St.on[i]) cv.plot(u => yi(i, u, t), { color: COL[i], width: 1.4, alpha: PROJ ? 0.28 : 0.22, dash: [5, 6] });
      for (const i of o) cv.plot(u => yi(i, u, t), { color: COL[i], width: hl(i) ? 4.6 : 2.6 });
    });
    drawLine(cv);
    const u = cursor(), X = cv.px(u), Y0 = cv.py(0), d = S(6);
    const lab = [];
    o.forEach((i, k) => {
      const Xi = X + (k - (o.length - 1) / 2) * 2 * d, v = yi(i, u, t);
      cv.arrowPx(Xi, Y0, Xi, cv.py(v), { color: COL[i], width: 3, head: 10 });
      cv.dotPx(X, cv.py(v), 5.5, { color: COL[i], stroke: ring, width: 1.5 * SC });
      lab.push({ str: `y${SUB[i]} = ` + mfmt(v), X: k === 0 ? X - d * o.length : X + d * o.length, Y: cv.py(v), side: k === 0 ? 'left' : 'right', color: COL[i] });
    });
    labels(cv, lab);
    // 山の取っ手（入っている波だけ）
    for (const i of IDX) {
      const hd = handles[i];
      if (!(active && active.kind === 'h' && active.i === i)) chooseK(i);
      const q = hd.get(); hd.hidden = !St.on[i] || q.x < 0 || q.x > W();
      if (hd.hidden) continue;
      const HX = cv.px(q.x), HY = cv.py(q.y), on = hl(i);
      if (on) { const g = cv.ctx; g.save(); g.strokeStyle = COL[i]; g.lineWidth = 2 * SC; g.beginPath(); g.arc(HX, HY, S(13), 0, TAU); g.stroke(); g.restore(); }
      cv.dotPx(HX, HY, on ? 8.5 : 7, { color: COL[i], stroke: ring, width: 2 * SC });
      cv.textPx(`A${SUB[i]}`, HX, HY - S(17), { color: COL[i], bold: true, size: 13 });
    }
  }
  function drawLower(t) {
    const cv = cvL, o = ons(); setupPanel(cv);
    cv.clip(() => {
      if (St.ghost) for (const i of o) cv.plot(u => yi(i, u, t), { color: COL[i], width: 1.6, alpha: PROJ ? 0.55 : 0.4 });
      cv.plot(u => ysum(u, t), { color: C.wave, width: 4 });
    });
    drawLine(cv);
    const u = cursor(), X = cv.px(u), Y0 = cv.py(0), d = S(11);
    // 矢印を頭と尾で順につなぐ: 最後の矢印は縦線上（先端＝合成波の点）、それより前は左へ d ずつ
    const lab = []; let acc = 0;
    o.forEach((i, k) => {
      const v = yi(i, u, t), Xi = X - (o.length - 1 - k) * d;
      const Ya = cv.py(acc), Yb = cv.py(acc + v);
      if (k > 0) cv.linePx(Xi - d, Ya, Xi, Ya, { color: COL[o[k - 1]], width: 1.6, dash: [3, 3] });
      cv.arrowPx(Xi, Ya, Xi, Yb, { color: COL[i], width: 3, head: 10 });
      lab.push({ str: `y${SUB[i]} = ` + mfmt(v), X: Xi, Y: (Ya + Yb) / 2, side: k === o.length - 1 ? 'right' : 'left', color: COL[i] });
      acc += v;
    });
    const y = acc;
    if (!o.length) cv.dotPx(X, Y0, 3, { color: C.wave });
    cv.dotPx(X, cv.py(y), 6.5, { color: C.wave, stroke: ring, width: 1.8 * SC });
    const lastV = o.length ? yi(o[o.length - 1], u, t) : 0;
    lab.push({ str: 'y = ' + mfmt(y), X, Y: cv.py(y) + (lastV >= 0 ? -S(4) : S(4)), side: 'right', color: C.wave });
    labels(cv, lab);
  }

  function updReadouts(t) {
    const u = cursor(), o = ons();
    const parts = o.map(i => `<span class="wv${i}">y${SUB[i]} = ${N(yi(i, u, t))} m</span>`);
    ro.set(parts.join('　') + `　<span class="wvy">y = ${N(ysum(u, t))} m</span>`);
    roPos.set(isX() ? `x = ${N(u, 2, 6)} m` : `t = ${N(u, 2, 6)} s`);
    const P = sumPeriod();
    roPer.set(P == null ? `<span class="num" style="min-width:6ch">—</span>` : `${N(P, 2, 6)} ${isX() ? 'm' : 's'}`);
    const s = shiftArr(), q = isX() ? 'Δx' : 'Δt', un = isX() ? 'm' : 's';
    roShift.set(o.length ? o.map(i => `<span class="wv${i}">${q}${SUB[i]} = ${N(mod(s[i], per(i)), 2, 5)} ${un}</span>`).join('　') : '—');
  }

  syncAxisUI();

  window.__oto_debug = {
    St, sim, cvU, cvL, yi: (i, u) => yi(i, u, curT), ysum: u => ysum(u, curT), cursor, per, W, sumPeriod,
    setAxis: v => selAxis.set(v), preset: v => selPre.set(v), peak: i => handles[i].get(), curT: () => curT,
    toggleOn: (i, b) => tOn[i].set(b), toggleGhost: b => tGhost.set(b)
  };
  applyPreset('p12');

  return {
    loop: () => (isX() ? 0 : St.Wt),
    tMax: () => (isX() ? 0 : St.Wt),
    timeLabel: t => (isX() ? `<i>t</i> = ${N(t, 2, 6)} s（波が進んだ時間）` : `<i>t</i> = ${N(t, 2, 6)} s（縦線の時刻）`),
    draw(t) {
      curT = t; updY();
      drawUpper(t); drawLower(t); updReadouts(t);
    }
  };
}

Nami.init({
  title: '正弦波の合成',
  appName: 'おとラボ', appHref: './index.html',
  footerBase: '',
  tabs: [{ id: 'combine', label: '正弦波の合成', period: () => (St.axis === 'x' ? Math.max(...St.lam) / Math.max(0.05, St.v) : 1 / Math.min(...St.f)), build: buildCombine }]
});
})();
</script>
